# Supabase's free plan pauses a project after ~7 days without activity, and the API then
# crashes on boot. /health reads the patient count, so pinging it touches the database.
# Both the pilot and the judge-demo API have their own database, so both are pinged.
name: keep-alive

on:
  schedule:
    - cron: "17 3 */2 * *"   # every other day, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api:
          - https://oushodhsathi-api.onrender.com
          - https://oushodhsathi-demo-api.onrender.com
    steps:
      - name: Ping API health (wakes Render, touches Supabase)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -m 90 "${{ matrix.api }}/health" > /dev/null; then
              echo "healthy"; exit 0
            fi
            echo "attempt $i failed, retrying"; sleep 30
          done
          echo "::error::${{ matrix.api }} health check failed; Supabase may be paused"; exit 1
