# Render Blueprint for the OushodhSathi API (Free plan).
# New → Blueprint → pick this repo. Secrets marked `sync: false` are entered in the
# Render dashboard (leave them blank to run in demo mode), never committed.
#
# Free plan: no persistent disk, so SQLite lives on the instance and the invented demo
# household is seeded on every start (`--if-empty` never overwrites existing data).
# Reviews do not survive a restart or spin-down. For persistence, switch to
# `plan: starter`, add a `disk` (mountPath /var/data) and set OUSHODH_DB=/var/data/oushodh.db.
services:
  - type: web
    name: oushodhsathi-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore        # closest Render region to Bangladesh
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_demo.py --if-empty && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_MODE
        value: "true"
      - key: OLLAMA_DISABLED     # no Ollama on Render; Bangla explanations use the cloud fallback
        value: "1"
      - key: CORS_ORIGIN_REGEX   # the Vercel frontend, including preview deploys
        value: ^https://oushodhsathi[a-z0-9-]*\.vercel\.app$
      - key: REVIEWER_TOKEN      # generated by Render; read it once in the dashboard → Environment
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: N8N_ALERT_WEBHOOK
        sync: false
