# Render Blueprint for the OushodhSathi API.
# New → Blueprint → pick this repo. Secrets marked `sync: false` are entered in the
# Render dashboard, never committed.
#
# Free plan: no persistent disk and no pre-deploy step, so SQLite is a local file that
# resets when the instance restarts, and the invented demo household is re-seeded on
# start. To keep reviews and the audit trail across restarts, switch to `plan: starter`,
# add the `disk` block below and set OUSHODH_DB=/var/data/oushodh.db:
#   disk: { name: oushodh-data, mountPath: /var/data, sizeGB: 1 }
services:
  - type: web
    name: oushodhsathi-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore        # closest Render region to Bangladesh
    buildCommand: pip install -r requirements.txt
    # seed the demo household when the database is empty, then serve
    startCommand: python scripts/seed_demo.py --if-empty && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEMO_MODE
        value: "true"
      - key: OLLAMA_DISABLED     # no Ollama on Render; Bangla explanations use the cloud fallback
        value: "1"
      - key: CORS_ORIGINS
        sync: false              # e.g. https://oushodhsathi.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false              # optional, e.g. ^https://oushodhsathi-.*\.vercel\.app$ for previews
      - key: REVIEWER_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: NARAROUTER_BASE_URL
        sync: false
      - key: NARAROUTER_API_KEY
        sync: false
      - key: NARAROUTER_MODEL
        sync: false
      - key: EXPLAB_BASE_URL
        sync: false
      - key: EXPLAB_API_KEY
        sync: false
      - key: EXPLAB_MODEL
        sync: false
      - key: AGENTROUTER_BASE_URL
        sync: false
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_MODEL
        sync: false
      - key: N8N_ALERT_WEBHOOK
        sync: false
